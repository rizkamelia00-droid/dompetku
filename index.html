<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DompetNol — Catat Keuangan</title>
  <style>
    :root {
      --bg: #fdf6f8;
      --bg-pattern: #f9eef2;
      --surface: #ffffff;
      --surface-soft: #fdf2f6;
      --ink: #2b2328;
      --muted: #8b7b84;
      --accent: #e58ca8;
      --accent-dark: #c96888;
      --accent-soft: #fce7ef;
      --green: #2e8b57;
      --green-soft: #eef8f1;
      --amber: #d49b35;
      --amber-soft: #fff8e7;
      --blue: #5b8fd9;
      --blue-soft: #edf4ff;
      --border: #f1dfe6;
      --shadow: 0 8px 24px rgba(145, 78, 102, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        linear-gradient(45deg, var(--bg-pattern) 25%, transparent 25%),
        linear-gradient(-45deg, var(--bg-pattern) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--bg-pattern) 75%),
        linear-gradient(-45deg, transparent 75%, var(--bg-pattern) 75%);
      background-size: 36px 36px;
      background-position: 0 0, 0 18px, 18px -18px, -18px 0;
      min-height: 100vh;
      padding-bottom: 96px;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 14px 28px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 12px;
      box-shadow: var(--shadow);
    }

    .brand-title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-pill {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface-soft);
      padding: 4px 8px;
      border-radius: 999px;
      max-width: 155px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-mini {
      border: none;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    .btn-mini.secondary {
      background: var(--surface-soft);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .card-handle {
      width: 34px;
      height: 4px;
      border-radius: 999px;
      background: #e6d6dd;
      margin: 0 auto 10px;
    }

    .label-muted {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .diff-amount {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin: 0 0 12px;
      color: var(--ink);
    }

    .diff-amount.neg {
      color: #c84b68;
    }

    .diff-amount.pos {
      color: var(--green);
    }

    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .summary-box {
      border-radius: 16px;
      padding: 11px 12px;
    }

    .summary-box.out {
      background: #fff1f5;
    }

    .summary-box.in {
      background: #f5f9e8;
    }

    .summary-box .s-label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .summary-box.out .s-label,
    .summary-box.out .s-val {
      color: #c96888;
    }

    .summary-box.in .s-label,
    .summary-box.in .s-val {
      color: #4f8a2b;
    }

    .summary-box .s-val {
      font-size: 16px;
      font-weight: 700;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .budget-meta {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .progress-track {
      height: 10px;
      border-radius: 999px;
      background: #f3e8ed;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f3a9c0, #df7b9c);
      transition: width 0.25s ease;
    }

    .budget-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .cat-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .cat-list-item:last-child {
      margin-bottom: 0;
    }

    .cat-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .cat-bar-wrap {
      flex: 1;
      min-width: 0;
    }

    .cat-bar-top {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .cat-mini-track {
      height: 6px;
      border-radius: 999px;
      background: #f4eaf0;
      overflow: hidden;
    }

    .cat-mini-fill {
      height: 100%;
      border-radius: 999px;
    }

    .tx-day-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin: 12px 0 8px;
      text-transform: uppercase;
    }

    .tx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f7eef2;
    }

    .tx-row:last-child {
      border-bottom: none;
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .tx-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-right {
      text-align: right;
      flex-shrink: 0;
    }

    .tx-amt {
      font-size: 14px;
      font-weight: 700;
    }

    .tx-amt.out {
      color: var(--ink);
    }

    .tx-amt.in {
      color: #4f8a2b;
    }

    .tx-amt.tr {
      color: var(--ink);
    }

    .tx-del {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
    }

    .fab-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 20;
    }

    .fab-btn {
      pointer-events: auto;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 13px 26px;
      box-shadow: 0 10px 24px rgba(214, 114, 148, 0.38);
      cursor: pointer;
    }

    .fab-btn:active {
      transform: scale(0.98);
    }

    /* Modal / Sheet Catat Transaksi */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(43, 35, 40, 0.35);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 40;
      padding: 10px 10px 0;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 26px 26px 0 0;
      padding: 14px 16px 24px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.12);
    }

    .sheet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sheet-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #f7eef2;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
    }

    .import-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .import-btn {
      border: none;
      border-radius: 999px;
      background: #f8eff3;
      color: #6f5d66;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
    }

    .seg-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #f8eff3;
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      border-radius: 12px;
      padding: 8px 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }

    .seg-btn.active {
      background: #fff;
      color: var(--accent-dark);
      box-shadow: 0 2px 8px rgba(145, 78, 102, 0.1);
    }

    .amount-display {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 4px 14px;
      border-bottom: 1.5px dashed #ebd7e0;
      margin-bottom: 14px;
    }

    .rp-prefix {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    .amount-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 32px;
      font-weight: 800;
      color: var(--ink);
      background: transparent;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .cat-tile {
      border: 1.5px solid #f4e6ec;
      background: #fff;
      border-radius: 16px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
    }

    .cat-tile.selected {
      border-color: var(--accent);
      background: #fff7fa;
    }

    .cat-icon-box {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field-box {
      background: #fdf6f9;
      border: 1px solid #f4e3ea;
      border-radius: 14px;
      padding: 8px 10px;
    }

    .field-box label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .field-box select,
    .field-box input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
    }

    .submit-main {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      margin-top: 8px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(214, 114, 148, 0.35);
    }

    .import-box {
      display: none;
      background: #fdf6f9;
      border: 1px solid #f2dbe4;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .import-box.open {
      display: block;
    }

    .import-box textarea {
      width: 100%;
      min-height: 76px;
      border: 1px solid #ebd2dd;
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      background: #fff;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b2328;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      z-index: 60;
      display: none;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="app-shell">
    <div class="top-bar">
      <div class="brand-title"><span>DompetNol</span></div>
      <div id="sync-status" class="sync-pill">Lokal siap</div>
      <button id="auth-btn" type="button" class="btn-mini">Login Google</button>
    </div>

    <!-- Selisih bulan ini -->
    <div class="card">
      <div class="card-handle"></div>
      <div class="label-muted">Selisih bulan ini</div>
      <div id="diff-month" class="diff-amount">Rp0</div>
      <div class="summary-row">
        <div class="summary-box out">
          <div class="s-label">Keluar</div>
          <div id="total-out" class="s-val">Rp0</div>
        </div>
        <div class="summary-box in">
          <div class="s-label">Masuk</div>
          <div id="total-in" class="s-val">Rp0</div>
        </div>
      </div>
    </div>

    <!-- Budget -->
    <div class="card">
      <div class="card-header-row">
        <h2 class="card-title">Budget</h2>
        <div id="budget-ratio" class="budget-meta">Rp0 / Rp1.000.000</div>
      </div>
      <div class="progress-track">
        <div id="budget-bar" class="progress-fill" style="width: 0%;"></div>
      </div>
      <div class="budget-sub">
        <span id="budget-hint">Sisa Rp1.000.000 · jatah harian</span>
        <button id="edit-budget-btn" type="button" class="link-btn">Atur budget</button>
      </div>
    </div>

    <!-- Ke mana uangnya? -->
    <div class="card">
      <div class="card-header-row">
        <h2 class="card-title">Ke mana uangnya?</h2>
        <select id="rekap-filter" style="border:1px solid var(--border);border-radius:10px;padding:4px 8px;font-size:12px;background:#fff;color:var(--ink);">
          <option value="ALL">Semua rekap</option>
        </select>
      </div>
      <div id="category-breakdown"></div>
    </div>

    <!-- Transaksi terbaru -->
    <div class="card">
      <div class="card-header-row">
        <h2 class="card-title">Transaksi terbaru</h2>
        <span id="tx-count" class="budget-meta">0 transaksi</span>
      </div>
      <div id="tx-groups"></div>
    </div>
  </div>

  <!-- Tombol + Catat -->
  <div class="fab-wrap">
    <button id="open-sheet-btn" type="button" class="fab-btn">+ Catat</button>
  </div>

  <!-- Modal / Sheet Catat transaksi -->
  <div id="tx-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="sheet-heading">
    <div class="sheet">
      <div class="card-handle"></div>
      <div class="sheet-top">
        <h2 id="sheet-heading" class="sheet-title">Catat transaksi</h2>
        <button id="close-sheet-btn" type="button" class="close-btn" aria-label="Tutup">×</button>
      </div>

      <div class="import-row">
        <button id="toggle-import-btn" type="button" class="import-btn">Import mutasi</button>
      </div>

      <div id="import-box" class="import-box">
        <div class="label-muted">Tempel baris mutasi (contoh: <code>2026-11-25 Makan siang 25000</code> atau <code>2026-11-25,Masuk,150000,Fee</code>)</div>
        <textarea id="import-text" placeholder="2026-11-25 Kopi susu 22000&#10;2026-11-25 Gaji/Fee 500000 masuk"></textarea>
        <button id="run-import-btn" type="button" class="btn-mini">Proses Mutasi</button>
      </div>

      <div class="seg-tabs">
        <button type="button" class="seg-btn active" data-type="expense">Keluar</button>
        <button type="button" class="seg-btn" data-type="income">Masuk</button>
        <button type="button" class="seg-btn" data-type="transfer">Transfer</button>
      </div>

      <form id="tx-form">
        <div class="amount-display">
          <span class="rp-prefix">Rp</span>
          <input
            id="tx-amount"
            type="number"
            inputmode="numeric"
            min="1"
            step="any"
            placeholder="0"
            class="amount-input"
            required
          />
        </div>

        <div id="category-section">
          <span class="section-label">Kategori</span>
          <div id="category-grid" class="cat-grid"></div>
        </div>

        <div class="form-grid-2">
          <div class="field-box">
            <label id="wallet-from-label" for="tx-wallet">Bayar pakai</label>
            <select id="tx-wallet"></select>
          </div>
          <div class="field-box">
            <label for="tx-date">Tanggal</label>
            <input id="tx-date" type="date" required />
          </div>
        </div>

        <div id="transfer-to-wrap" class="field-box" style="display:none;margin-bottom:12px;">
          <label for="tx-wallet-to">Transfer ke</label>
          <select id="tx-wallet-to"></select>
        </div>

        <div class="form-grid-2">
          <div class="field-box">
            <label for="tx-note">Catatan</label>
            <input id="tx-note" type="text" placeholder="misal: legging, kopi" />
          </div>
          <div class="field-box">
            <label for="tx-rekap">Masuk rekap</label>
            <input id="tx-rekap" type="text" list="rekap-datalist" placeholder="Pribadi / Caca" />
            <datalist id="rekap-datalist"></datalist>
          </div>
        </div>

        <button type="submit" class="submit-main">Simpan</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "dompetku_tracker_v2";
      const DEFAULT_STATE = {
        updatedAtClient: Date.now(),
        monthlyBudget: 1000000,
        wallets: [
          { id: "w_bca", name: "BCA", balance: 0 },
          { id: "w_seabank", name: "SeaBank", balance: 0 },
          { id: "w_gopay", name: "GoPay", balance: 0 },
          { id: "w_cash", name: "Cash", balance: 0 }
        ],
        categories: [
          { id: "Makan", label: "Makan", icon: "🍲", bg: "#fdecef", bar: "#e58ca8" },
          { id: "Jajan & Kopi", label: "Jajan & Kopi", icon: "🥤", bg: "#f5ecfa", bar: "#b784d7" },
          { id: "Transport", label: "Transport", icon: "🛵", bg: "#eaf7f1", bar: "#47a87e" },
          { id: "Belanja", label: "Belanja", icon: "🛍️", bg: "#fff8e5", bar: "#e0aa3e" },
          { id: "Tagihan", label: "Tagihan", icon: "🧾", bg: "#eef4ff", bar: "#6b9ae8" },
          { id: "Pakaian", label: "Pakaian", icon: "👚", bg: "#fff1e6", bar: "#e69458" },
          { id: "Kesehatan", label: "Kesehatan", icon: "🩺", bg: "#eaf8f2", bar: "#43a87d" },
          { id: "Hiburan", label: "Hiburan", icon: "🎬", bg: "#f3ecfc", bar: "#9c72d9" },
          { id: "Pendidikan", label: "Pendidikan", icon: "🎓", bg: "#edf4ff", bar: "#5d8fe6" },
          { id: "Hadiah", label: "Hadiah", icon: "🎁", bg: "#fdebf3", bar: "#de7ca4" },
          { id: "Rumah", label: "Rumah", icon: "🏠", bg: "#fff1e8", bar: "#df8a56" },
          { id: "Lainnya", label: "Lainnya", icon: "✨", bg: "#fff8e6", bar: "#dfb047" }
        ],
        transactions: []
      };

      const firebaseConfig = {
        apiKey: "AIzaSyAh0TZpuyNuxN2Vl7NE6E-dCsgZOHcY_6c",
        authDomain: "dompetku-2a80d.firebaseapp.com",
        projectId: "dompetku-2a80d",
        storageBucket: "dompetku-2a80d.firebasestorage.app",
        messagingSenderId: "814717028905",
        appId: "1:814717028905:web:4fb8ff55ecd1cda310ea38",
        measurementId: "G-NJEQ9LNY6P"
      };

      let state = loadLocalState();
      let currentType = "expense";
      let selectedCategory = "Makan";
      let fbAuth = null;
      let fbDb = null;
      let fbUser = null;
      let fbSetDoc = null;
      let fbDoc = null;
      let fbServerTimestamp = null;

      function todayISO() {
        const d = new Date();
        const off = d.getTimezoneOffset();
        const local = new Date(d.getTime() - off * 60000);
        return local.toISOString().slice(0, 10);
      }

      function formatRp(num) {
        const n = Number(num) || 0;
        const sign = n < 0 ? "-" : "";
        return sign + "Rp" + Math.abs(Math.round(n)).toLocaleString("id-ID");
      }

      function showToast(msg) {
        const el = document.getElementById("toast");
        if (!el) return;
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove("show"), 2200);
      }

      function loadLocalState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return cloneDefault();
          const parsed = JSON.parse(raw);
          return {
            ...cloneDefault(),
            ...parsed,
            wallets: Array.isArray(parsed.wallets) && parsed.wallets.length ? parsed.wallets : cloneDefault().wallets,
            categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : cloneDefault().categories,
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : []
          };
        } catch (_) {
          return cloneDefault();
        }
      }

      function cloneDefault() {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }

      function saveState() {
        state.updatedAtClient = Date.now();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_) {}
        renderAll();
        syncToFirebase();
      }

      function applyTxToWallets(tx, dir) {
        const factor = dir === "revert" ? -1 : 1;
        const amt = Number(tx.amount) || 0;
        const fromW = state.wallets.find((w) => w.id === tx.walletId);
        if (tx.type === "income" && fromW) {
          fromW.balance = (Number(fromW.balance) || 0) + amt * factor;
        } else if (tx.type === "expense" && fromW) {
          fromW.balance = (Number(fromW.balance) || 0) - amt * factor;
        } else if (tx.type === "transfer") {
          const toW = state.wallets.find((w) => w.id === tx.toWalletId);
          if (fromW) fromW.balance = (Number(fromW.balance) || 0) - amt * factor;
          if (toW) toW.balance = (Number(toW.balance) || 0) + amt * factor;
        }
      }

      function addTransaction(payload) {
        const tx = {
          id: "tx_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          date: payload.date || todayISO(),
          type: payload.type,
          amount: Math.abs(Number(payload.amount) || 0),
          category: payload.type === "transfer" ? "Transfer" : (payload.category || "Lainnya"),
          walletId: payload.walletId,
          toWalletId: payload.toWalletId || null,
          note: (payload.note || "").trim(),
          rekap: (payload.rekap || "Pribadi").trim() || "Pribadi"
        };
        if (tx.amount <= 0) return false;
        applyTxToWallets(tx, "apply");
        state.transactions.unshift(tx);
        saveState();
        return true;
      }

      function deleteTransaction(id) {
        const idx = state.transactions.findIndex((t) => t.id === id);
        if (idx === -1) return;
        const [removed] = state.transactions.splice(idx, 1);
        applyTxToWallets(removed, "revert");
        saveState();
        showToast("Transaksi dihapus");
      }

      function renderAll() {
        const now = new Date();
        const ym = now.toISOString().slice(0, 7);
        const monthTxs = state.transactions.filter((t) => (t.date || "").startsWith(ym));

        const totalOut = monthTxs
          .filter((t) => t.type === "expense")
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        const totalIn = monthTxs
          .filter((t) => t.type === "income")
          .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        const diff = totalIn - totalOut;

        const diffEl = document.getElementById("diff-month");
        diffEl.textContent = formatRp(diff);
        diffEl.className = "diff-amount" + (diff < 0 ? " neg" : diff > 0 ? " pos" : "");

        document.getElementById("total-out").textContent = formatRp(totalOut);
        document.getElementById("total-in").textContent = formatRp(totalIn);

        const budget = Math.max(0, Number(state.monthlyBudget) || 0);
        const pct = budget > 0 ? Math.min(100, Math.round((totalOut / budget) * 100)) : 0;
        const sisa = budget - totalOut;
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const remDays = Math.max(1, daysInMonth - now.getDate() + 1);
        const dailyQuota = Math.max(0, Math.round(sisa / remDays));

        document.getElementById("budget-ratio").textContent = `${formatRp(totalOut)} / ${formatRp(budget)}`;
        document.getElementById("budget-bar").style.width = pct + "%";
        document.getElementById("budget-hint").textContent =
          `Sisa ${formatRp(sisa)} · ${remDays} hari lagi · jatah ${formatRp(dailyQuota)}/hari`;

        // Rekap filter
        const rekapSet = new Set(["Pribadi"]);
        state.transactions.forEach((t) => {
          if (t.rekap) rekapSet.add(t.rekap);
        });
        const rekapFilter = document.getElementById("rekap-filter");
        const prevFilter = rekapFilter.value || "ALL";
        rekapFilter.innerHTML = `<option value="ALL">Semua rekap</option>` +
          Array.from(rekapSet).map((r) => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join("");
        rekapFilter.value = Array.from(rekapFilter.options).some((o) => o.value === prevFilter) ? prevFilter : "ALL";

        const dl = document.getElementById("rekap-datalist");
        dl.innerHTML = Array.from(rekapSet).map((r) => `<option value="${escapeHtml(r)}"></option>`).join("");

        // Ke mana uangnya?
        const activeRekap = rekapFilter.value;
        const filteredOut = monthTxs.filter(
          (t) => t.type === "expense" && (activeRekap === "ALL" || (t.rekap || "Pribadi") === activeRekap)
        );
        const byCat = {};
        filteredOut.forEach((t) => {
          const k = t.category || "Lainnya";
          byCat[k] = (byCat[k] || 0) + (Number(t.amount) || 0);
        });
        const sortedCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
        const maxCat = sortedCats.length ? sortedCats[0][1] : 1;
        const catBreakdownEl = document.getElementById("category-breakdown");

        if (!sortedCats.length) {
          catBreakdownEl.innerHTML = `<div class="label-muted">Belum ada pengeluaran bulan ini.</div>`;
        } else {
          catBreakdownEl.innerHTML = sortedCats.map(([catName, amt]) => {
            const meta = state.categories.find((c) => c.id === catName) || {
              icon: "✨",
              bg: "#fff8e6",
              bar: "#dfb047"
            };
            const wPct = Math.max(6, Math.round((amt / maxCat) * 100));
            return `
              <div class="cat-list-item">
                <div class="cat-badge" style="background:${meta.bg};">${meta.icon}</div>
                <div class="cat-bar-wrap">
                  <div class="cat-bar-top">
                    <span>${escapeHtml(catName)}</span>
                    <span>${formatRp(amt)}</span>
                  </div>
                  <div class="cat-mini-track">
                    <div class="cat-mini-fill" style="width:${wPct}%;background:${meta.bar};"></div>
                  </div>
                </div>
              </div>
            `;
          }).join("");
        }

        // Transaksi terbaru per tanggal
        document.getElementById("tx-count").textContent = `${state.transactions.length} transaksi`;
        const groupsEl = document.getElementById("tx-groups");
        if (!state.transactions.length) {
          groupsEl.innerHTML = `<div class="label-muted">Belum ada transaksi. Tekan + Catat untuk mulai.</div>`;
        } else {
          const grouped = {};
          state.transactions.slice(0, 40).forEach((t) => {
            const dKey = t.date || todayISO();
            if (!grouped[dKey]) grouped[dKey] = [];
            grouped[dKey].push(t);
          });

          groupsEl.innerHTML = Object.entries(grouped).map(([dKey, list]) => {
            const netDay = list.reduce((sum, item) => {
              if (item.type === "income") return sum + (Number(item.amount) || 0);
              if (item.type === "expense") return sum - (Number(item.amount) || 0);
              return sum;
            }, 0);
            const wFromName = (id) => (state.wallets.find((w) => w.id === id) || {}).name || "Akun";

            const rowsHtml = list.map((item) => {
              const meta = state.categories.find((c) => c.id === item.category) || {
                icon: item.type === "transfer" ? "⇄" : item.type === "income" ? "💰" : "✨",
                bg: item.type === "transfer" ? "#edf4ff" : item.type === "income" ? "#f5f9e8" : "#fff8e6"
              };
              const subText = item.type === "transfer"
                ? `${wFromName(item.walletId)} → ${wFromName(item.toWalletId)}${item.note ? " · " + item.note : ""}`
                : `${item.note ? item.note + " · " : ""}${wFromName(item.walletId)} (${item.rekap || "Pribadi"})`;

              const amtClass = item.type === "income" ? "in" : item.type === "transfer" ? "tr" : "out";
              const amtPrefix = item.type === "income" ? "+" : item.type === "expense" ? "-" : "";

              return `
                <div class="tx-row">
                  <div class="tx-left">
                    <div class="cat-badge" style="background:${meta.bg};">${meta.icon}</div>
                    <div style="min-width:0;">
                      <div class="tx-title">${escapeHtml(item.type === "transfer" ? "Transfer" : item.category)}</div>
                      <div class="tx-sub">${escapeHtml(subText)}</div>
                    </div>
                  </div>
                  <div class="tx-right">
                    <div class="tx-amt ${amtClass}">${amtPrefix}${formatRp(item.amount)}</div>
                    <button type="button" class="tx-del" data-del-id="${item.id}">Hapus</button>
                  </div>
                </div>
              `;
            }).join("");

            return `
              <div class="tx-day-header">
                <span>${formatDayLabel(dKey)}</span>
                <span>${formatRp(netDay)}</span>
              </div>
              ${rowsHtml}
            `;
          }).join("");
        }

        renderCategoryGrid();
        renderWalletSelects();
      }

      function formatDayLabel(isoDate) {
        const parts = (isoDate || "").split("-");
        if (parts.length !== 3) return isoDate;
        const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        if (Number.isNaN(dt.getTime())) return isoDate;
        const hari = ["MIN", "SEN", "SEL", "RAB", "KAM", "JUM", "SAB"];
        const bln = ["JAN", "FEB", "MAR", "APR", "MEI", "JUN", "JUL", "AGU", "SEP", "OKT", "NOV", "DES"];
        return `${hari[dt.getDay()]}, ${dt.getDate()} ${bln[dt.getMonth()]}`;
      }

      function renderCategoryGrid() {
        const grid = document.getElementById("category-grid");
        grid.innerHTML = state.categories.map((c) => {
          const active = c.id === selectedCategory ? "selected" : "";
          return `
            <button type="button" class="cat-tile ${active}" data-cat="${escapeHtml(c.id)}">
              <div class="cat-icon-box" style="background:${c.bg};">${c.icon}</div>
              <span>${escapeHtml(c.label)}</span>
            </button>
          `;
        }).join("");

        grid.querySelectorAll(".cat-tile").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectedCategory = btn.getAttribute("data-cat");
            renderCategoryGrid();
          });
        });
      }

      function renderWalletSelects() {
        const wSel = document.getElementById("tx-wallet");
        const wToSel = document.getElementById("tx-wallet-to");
        const curFrom = wSel.value;
        const curTo = wToSel.value;

        const opts = state.wallets.map((w) => `<option value="${w.id}">${escapeHtml(w.name)} (${formatRp(w.balance)})</option>`).join("");
        wSel.innerHTML = opts;
        wToSel.innerHTML = opts;

        if (curFrom && state.wallets.some((w) => w.id === curFrom)) wSel.value = curFrom;
        if (curTo && state.wallets.some((w) => w.id === curTo)) {
          wToSel.value = curTo;
        } else if (state.wallets.length > 1) {
          wToSel.value = state.wallets[1].id;
        }
      }

      function setTransactionType(type) {
        currentType = type;
        document.querySelectorAll(".seg-btn").forEach((b) => {
          b.classList.toggle("active", b.getAttribute("data-type") === type);
        });
        const isTransfer = type === "transfer";
        document.getElementById("category-section").style.display = isTransfer ? "none" : "block";
        document.getElementById("transfer-to-wrap").style.display = isTransfer ? "block" : "none";
        document.getElementById("wallet-from-label").textContent = isTransfer ? "Dari akun" : "Bayar pakai";
      }

      function openSheet() {
        document.getElementById("tx-date").value = todayISO();
        setTransactionType("expense");
        document.getElementById("tx-amount").value = "";
        document.getElementById("tx-note").value = "";
        document.getElementById("tx-modal").classList.add("open");
        setTimeout(() => document.getElementById("tx-amount").focus(), 60);
      }

      function closeSheet() {
        document.getElementById("tx-modal").classList.remove("open");
      }

      function parseAndImportMutasi() {
        const raw = (document.getElementById("import-text").value || "").trim();
        if (!raw) {
          showToast("Tempel baris mutasi dulu");
          return;
        }
        const lines = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        const defaultWallet = state.wallets[0] ? state.wallets[0].id : "w_bca";
        let added = 0;

        lines.forEach((line) => {
          const numMatch = line.match(/(\d[\d.,]{2,})/);
          if (!numMatch) return;
          const cleanNum = Number(numMatch[1].replace(/[.,]/g, ""));
          if (!cleanNum || cleanNum <= 0) return;

          const lower = line.toLowerCase();
          const type = /\b(masuk|income|terima|gaji|fee)\b/.test(lower) ? "income" : "expense";
          const dateMatch = line.match(/\b(20\d{2}-\d{2}-\d{2})\b/);
          const dateVal = dateMatch ? dateMatch[1] : todayISO();

          let matchedCat = "Lainnya";
          for (const c of state.categories) {
            if (lower.includes(c.label.toLowerCase().split(" ")[0])) {
              matchedCat = c.id;
              break;
            }
          }

          const noteClean = line
            .replace(numMatch[0], "")
            .replace(dateVal, "")
            .replace(/[,|]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

          if (addTransaction({
            date: dateVal,
            type,
            amount: cleanNum,
            category: matchedCat,
            walletId: defaultWallet,
            note: noteClean || "Import mutasi",
            rekap: "Pribadi"
          })) {
            added += 1;
          }
        });

        if (added > 0) {
          document.getElementById("import-text").value = "";
          document.getElementById("import-box").classList.remove("open");
          closeSheet();
          showToast(`${added} mutasi berhasil masuk`);
        } else {
          showToast("Nominal mutasi tidak terbaca");
        }
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function syncToFirebase() {
        if (!fbUser || !fbDb || !fbSetDoc || !fbDoc) return;
        const statusEl = document.getElementById("sync-status");
        try {
          if (statusEl) statusEl.textContent = "Menyimpan cloud...";
          const ref = fbDoc(fbDb, "users", fbUser.uid, "dompetku", "state");
          await fbSetDoc(ref, {
            payload: state,
            updatedAtClient: state.updatedAtClient,
            updatedAtServer: fbServerTimestamp ? fbServerTimestamp() : Date.now()
          }, { merge: true });
          if (statusEl) statusEl.textContent = fbUser.email || "Tersinkron";
        } catch (_) {
          if (statusEl) statusEl.textContent = "Lokal (sync gagal)";
        }
      }

      async function initFirebaseSafely() {
        const statusEl = document.getElementById("sync-status");
        const authBtn = document.getElementById("auth-btn");
        try {
          const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
          const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
          const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

          const app = appMod.initializeApp(firebaseConfig);
          fbAuth = authMod.getAuth(app);
          fbDb = fsMod.getFirestore(app);
          fbSetDoc = fsMod.setDoc;
          fbDoc = fsMod.doc;
          fbServerTimestamp = fsMod.serverTimestamp;
          const provider = new authMod.GoogleAuthProvider();

          authBtn.addEventListener("click", async () => {
            try {
              if (fbUser) {
                await authMod.signOut(fbAuth);
                showToast("Keluar dari akun Google");
              } else {
                await authMod.signInWithPopup(fbAuth, provider);
              }
            } catch (err) {
              showToast("Login gagal: cek Authorized domains");
            }
          });

          authMod.onAuthStateChanged(fbAuth, async (user) => {
            fbUser = user;
            if (!user) {
              authBtn.textContent = "Login Google";
              if (statusEl) statusEl.textContent = "Mode lokal";
              return;
            }
            authBtn.textContent = "Keluar";
            if (statusEl) statusEl.textContent = "Memuat cloud...";
            try {
              const ref = fsMod.doc(fbDb, "users", user.uid, "dompetku", "state");
              const snap = await fsMod.getDoc(ref);
              if (snap.exists() && snap.data().payload) {
                const cloudData = snap.data();
                const cloudTs = Number(cloudData.updatedAtClient) || 0;
                const localTs = Number(state.updatedAtClient) || 0;
                if (cloudTs >= localTs) {
                  state = { ...cloneDefault(), ...cloudData.payload, updatedAtClient: cloudTs };
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                  renderAll();
                } else {
                  await syncToFirebase();
                }
              } else {
                await syncToFirebase();
              }
              if (statusEl) statusEl.textContent = user.email || "Tersinkron";
            } catch (_) {
              if (statusEl) statusEl.textContent = "Lokal aktif";
            }
          });
        } catch (_) {
          authBtn.addEventListener("click", () => {
            showToast("Mode lokal aktif (Firebase offline)");
          });
        }
      }

      // Bind semua event listener utama
      document.getElementById("open-sheet-btn").addEventListener("click", openSheet);
      document.getElementById("close-sheet-btn").addEventListener("click", closeSheet);
      document.getElementById("tx-modal").addEventListener("click", (e) => {
        if (e.target.id === "tx-modal") closeSheet();
      });

      document.querySelectorAll(".seg-btn").forEach((btn) => {
        btn.addEventListener("click", () => setTransactionType(btn.getAttribute("data-type")));
      });

      document.getElementById("toggle-import-btn").addEventListener("click", () => {
        document.getElementById("import-box").classList.toggle("open");
      });

      document.getElementById("run-import-btn").addEventListener("click", parseAndImportMutasi);

      document.getElementById("tx-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const amt = Number(document.getElementById("tx-amount").value);
        if (!amt || amt <= 0) {
          showToast("Masukkan nominal lebih dari 0");
          return;
        }
        const walletId = document.getElementById("tx-wallet").value;
        const toWalletId = document.getElementById("tx-wallet-to").value;
        if (currentType === "transfer" && walletId === toWalletId) {
          showToast("Pilih akun tujuan yang berbeda");
          return;
        }
        const ok = addTransaction({
          type: currentType,
          amount: amt,
          category: selectedCategory,
          walletId,
          toWalletId,
          date: document.getElementById("tx-date").value || todayISO(),
          note: document.getElementById("tx-note").value,
          rekap: document.getElementById("tx-rekap").value
        });
        if (ok) {
          closeSheet();
          showToast("Transaksi tersimpan");
        }
      });

      document.getElementById("edit-budget-btn").addEventListener("click", () => {
        const input = prompt("Masukkan target budget bulanan (angka saja, misal 1000000):", String(state.monthlyBudget || 1000000));
        if (input === null) return;
        const cleaned = Number(String(input).replace(/[^\d]/g, ""));
        if (!Number.isNaN(cleaned) && cleaned >= 0) {
          state.monthlyBudget = cleaned;
          saveState();
          showToast("Budget diperbarui");
        }
      });

      document.getElementById("rekap-filter").addEventListener("change", renderAll);

      document.getElementById("tx-groups").addEventListener("click", (e) => {
        const delBtn = e.target.closest("[data-del-id]");
        if (delBtn) {
          deleteTransaction(delBtn.getAttribute("data-del-id"));
        }
      });

      renderAll();
      initFirebaseSafely();
    })();
  </script>
</body>
</html>
